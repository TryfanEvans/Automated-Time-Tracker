<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracker</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f6f3;
            --surface: #ffffff;
            --surface2: #f0efe9;
            --border: rgba(0, 0, 0, 0.09);
            --border2: rgba(0, 0, 0, 0.16);
            --text: #1a1a18;
            --text2: #6b6b66;
            --text3: #9b9b95;
            --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            --r: 8px;
            --rl: 12px;
            --ws-c: #185FA5;
            --ws-b: #deeefb;
            --read-c: #0F6E56;
            --read-b: #d4eedd;
            --reddit-c: #E84422;
            --reddit-b: #fde8e3;
            --yt-c: #CC0000;
            --yt-b: #ffe0e0;
            --fb-c: #1877F2;
            --fb-b: #deeaff;
            --ig-c: #833AB4;
            --ig-b: #f0e6fc;
            --tw-c: #1DA1F2;
            --tw-b: #e0f4ff;
            --tt-c: #000000;
            --tt-b: #e8e8e8;
            --browse-c: #5F5E5A;
            --browse-b: #f1efe8;
            --msg-c: #085041;
            --msg-b: #c2eed9;
            --admin-c: #854F0B;
            --admin-b: #faeeda;
            --ent-c: #533AB7;
            --ent-b: #eeedfe;
            --news-c: #3B6D11;
            --news-b: #eaf3de;
            --disc-c: #5865F2;
            --disc-b: #eaebff;
            --oth-c: #9b9b95;
            --oth-b: #f1efe8;
            --meal-c: #633806;
            --meal-b: #fde0a6;
            --sleep-c: #444441;
            --sleep-b: #dddbd0;
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #141412;
                --surface: #1e1e1c;
                --surface2: #272724;
                --border: rgba(255, 255, 255, 0.07);
                --border2: rgba(255, 255, 255, 0.14);
                --text: #f0efe9;
                --text2: #9b9b95;
                --text3: #6b6b66;
                --ws-b: #0c2a45;
                --read-b: #073020;
                --reddit-b: #3a1008;
                --yt-b: #3a0000;
                --fb-b: #0a1e50;
                --ig-b: #2a1040;
                --tw-b: #062030;
                --tt-b: #1a1a1a;
                --browse-b: #2c2c2a;
                --msg-b: #041c14;
                --admin-b: #2e1c04;
                --ent-b: #1e1850;
                --news-b: #182808;
                --disc-b: #1a1d50;
                --oth-b: #2c2c2a;
                --meal-b: #2a1600;
                --sleep-b: #222220;
            }
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
        }

        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 920px;
            margin: 0 auto;
            padding: 0.75rem 0.75rem 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.2px;
        }

        .sub {
            font-size: 10px;
            color: var(--text3);
            margin-top: 2px;
        }

        .hbtns {
            display: flex;
            gap: 6px;
        }

        /* Two-column layout below header */
        .columns {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 8px;
            padding-bottom: 0.75rem;
        }

        /* ── Vertical timeline ────────────────────────────────────────────────────── */
        .tl-wrap {
            display: flex;
            flex-direction: row;
            flex-shrink: 0;
            width: 110px;
        }

        .tl-labels {
            width: 22px;
            flex-shrink: 0;
            position: relative;
        }

        .tl-labels-inner {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .vtl-tick {
            position: absolute;
            right: 4px;
            font-size: 8px;
            color: var(--text3);
            opacity: 0.45;
            transform: translateY(-50%);
            user-select: none;
            text-align: right;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .tl-bar {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: .5px solid var(--border);
            border-radius: var(--rl);
        }

        .vtl-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 0.5px;
            background: var(--border);
        }

        .vtl-block {
            position: absolute;
            left: 4px;
            right: 4px;
            border-radius: 3px;
            overflow: hidden;
            cursor: default;
            transition: opacity .1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vtl-block:hover {
            opacity: 0.85;
        }

        .vtl-manual {
            cursor: pointer;
        }

        .vtl-drag-handle {
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            cursor: ns-resize;
            z-index: 10;
            background: rgba(255, 255, 255, 0.25);
            opacity: 0;
            transition: opacity .15s;
        }

        .vtl-manual:hover .vtl-drag-handle {
            opacity: 1;
        }

        .vtl-drag-top {
            top: 0;
            border-radius: 3px 3px 0 0;
        }

        .vtl-drag-bot {
            bottom: 0;
            border-radius: 0 0 3px 3px;
        }

        .vtl-block-label {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            padding: 0 3px;
            line-height: 1.2;
            overflow: hidden;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            pointer-events: none;
        }

        .vtl-gap {
            position: absolute;
            left: 4px;
            right: 4px;
            border-radius: 3px;
            border: 1px dashed transparent;
            cursor: pointer;
            transition: background .1s, border-color .1s;
            min-height: 4px;
        }

        .vtl-gap:hover {
            background: rgba(128, 128, 128, 0.07);
            border-color: var(--border2);
        }

        .vtl-gap:hover::after {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: var(--text3);
            pointer-events: none;
        }

        .vtl-future {
            position: absolute;
            left: 4px;
            right: 4px;
            background: var(--surface2);
            border-radius: 3px;
            opacity: 0.4;
        }

        .vtl-now {
            position: absolute;
            left: 0;
            right: 0;
            height: 1.5px;
            background: var(--text);
            z-index: 10;
        }

        .vtl-now::before {
            content: '';
            position: absolute;
            left: 2px;
            top: -3px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text);
        }

        /* ── Main column ─────────────────────────────────────────────────────────── */
        .main-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .stat {
            background: var(--surface2);
            border-radius: var(--r);
            padding: 9px 11px;
        }

        .sl {
            font-size: 9px;
            color: var(--text3);
            letter-spacing: .05em;
            margin-bottom: 2px;
        }

        .sv {
            font-size: 18px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .su {
            font-size: 10px;
            color: var(--text2);
            font-weight: 400;
        }

        .card {
            background: var(--surface);
            border: .5px solid var(--border);
            border-radius: var(--rl);
            margin-bottom: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card.feed-card {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin-bottom: 0;
        }

        .ch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: .5px solid var(--border);
            font-size: 10px;
            color: var(--text3);
            letter-spacing: .06em;
            flex-shrink: 0;
        }

        .chr {
            font-size: 11px;
            color: var(--text2);
            letter-spacing: 0;
        }

        .wi {
            padding: 10px 12px 12px;
        }

        .wm {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text3);
            margin-bottom: 5px;
        }

        .bt {
            height: 6px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
        }

        .bf {
            height: 100%;
            background: var(--text);
            border-radius: 4px;
            transition: width .4s;
        }

        .cb {
            padding: 9px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cr {
            display: grid;
            grid-template-columns: 110px 1fr 42px;
            gap: 6px;
            align-items: center;
        }

        .cn {
            font-size: 10px;
            color: var(--text2);
            text-align: right;
        }

        .cbt {
            height: 6px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
        }

        .cbf {
            height: 100%;
            border-radius: 4px;
        }

        .ch2 {
            font-size: 10px;
            color: var(--text);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .tabs {
            display: flex;
            border-bottom: .5px solid var(--border);
            padding: 0 12px;
            flex-shrink: 0;
        }

        .tab {
            padding: 7px 8px 6px;
            font-size: 10px;
            color: var(--text3);
            cursor: pointer;
            border-bottom: 1.5px solid transparent;
            margin-bottom: -.5px;
            transition: color .15s;
        }

        .tab:hover {
            color: var(--text2);
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--text);
        }

        #feed {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        #feed::-webkit-scrollbar {
            width: 4px;
        }

        #feed::-webkit-scrollbar-track {
            background: transparent;
        }

        #feed::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px;
        }

        .fr {
            display: grid;
            grid-template-columns: 42px 90px 1fr 40px 20px;
            gap: 6px;
            padding: 8px 12px;
            border-bottom: .5px solid var(--border);
            font-size: 10px;
            align-items: center;
            transition: background .1s;
        }

        .fr:last-child {
            border-bottom: none;
        }

        .fr:hover {
            background: var(--surface2);
        }

        .ft {
            color: var(--text3);
            font-variant-numeric: tabular-nums;
        }

        .fi {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text2);
        }

        .fd {
            color: var(--text3);
            text-align: right;
        }

        .db {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text3);
            font-size: 13px;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 3px;
        }

        .db:hover {
            color: var(--text);
            background: var(--surface2);
        }

        .tag {
            display: inline-block;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: .04em;
            white-space: nowrap;
        }

        .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .fb {
            padding: 11px 12px;
        }

        .fl {
            font-size: 9px;
            color: var(--text3);
            letter-spacing: .04em;
            margin-bottom: 3px;
        }

        input,
        select,
        textarea {
            width: 100%;
            height: 30px;
            padding: 0 8px;
            border: .5px solid var(--border2);
            border-radius: var(--r);
            background: var(--surface2);
            color: var(--text);
            font-size: 11px;
            font-family: var(--mono);
            outline: none;
            transition: border-color .15s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--text3);
        }

        textarea {
            height: 48px;
            padding: 7px 8px;
            resize: none;
        }

        .brow {
            display: flex;
            gap: 6px;
        }

        .btn {
            height: 30px;
            padding: 0 14px;
            border: .5px solid var(--border2);
            border-radius: var(--r);
            background: var(--text);
            color: var(--bg);
            font-size: 11px;
            font-family: var(--mono);
            cursor: pointer;
            transition: opacity .15s;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: .85;
        }

        .btn:active {
            opacity: .7;
        }

        .btn-g {
            background: transparent;
            color: var(--text2);
        }

        .btn-g:hover {
            color: var(--text);
            opacity: 1;
        }

        .btn-red {
            background: #c0392b;
            color: #fff;
        }

        .btn-red:hover {
            background: #e74c3c;
            opacity: 1;
        }

        .empty {
            padding: 1.5rem;
            text-align: center;
            color: var(--text3);
            font-size: 11px;
        }

        .act-start-btn {
            background: var(--text);
            color: var(--bg);
        }

        .act-end-btn {
            background: #A32D2D;
            color: #fff;
            border-color: #A32D2D;
        }

        .act-running {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0 2px;
        }

        .act-running::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #A32D2D;
            animation: pulse 1.4s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .4;
                transform: scale(.85);
            }
        }

        .tl-tip {
            position: fixed;
            background: var(--text);
            color: var(--bg);
            font-size: 10px;
            padding: 4px 9px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 900;
            opacity: 0;
            transition: opacity .15s;
            white-space: nowrap;
        }

        .tl-tip.show {
            opacity: 1;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 800;
            align-items: center;
            justify-content: center;
        }

        .popup-overlay.show {
            display: flex;
        }

        .popup {
            background: var(--surface);
            border: .5px solid var(--border2);
            border-radius: var(--rl);
            padding: 16px 18px;
            width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        }

        .popup-title {
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text);
        }

        .popup-range {
            font-size: 11px;
            color: var(--text3);
            margin-bottom: 10px;
        }

        .popup-row {
            margin-bottom: 9px;
        }

        .popup-btns {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--text);
            color: var(--bg);
            padding: 8px 16px;
            border-radius: var(--r);
            font-size: 11px;
            font-family: var(--mono);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="page">

        <header>
            <div>
                <h1>activity tracker</h1>
                <div class="sub" id="last-up">connecting…</div>
            </div>
            <div class="hbtns">
                <button class="btn btn-g" onclick="exportCSV(7)">export 7d</button>
                <button class="btn btn-g" onclick="exportCSV(30)">export 30d</button>
            </div>
        </header>

        <div class="columns">

            <!-- Timeline: labels + bar side by side -->
            <div class="tl-wrap">
                <div class="tl-labels">
                    <div class="tl-labels-inner" id="vtl-labels"></div>
                </div>
                <div class="tl-bar" id="tl-bar"></div>
            </div>

            <!-- Main column -->
            <div class="main-col">

                <div class="stats">
                    <div class="stat">
                        <div class="sl">WORK/STUDY</div>
                        <div class="sv" id="s-today">—<span class="su">h</span></div>
                    </div>
                    <div class="stat">
                        <div class="sl">THIS WEEK</div>
                        <div class="sv" id="s-week">—<span class="su">h</span></div>
                    </div>
                    <div class="stat">
                        <div class="sl">GOAL</div>
                        <div class="sv">20<span class="su">h/wk</span></div>
                    </div>
                    <div class="stat">
                        <div class="sl">MANUAL</div>
                        <div class="sv" id="s-manual">—</div>
                    </div>
                </div>

                <div class="card">
                    <div class="ch">WEEKLY PROGRESS <span class="chr" id="wlabel">0 / 20h</span></div>
                    <div class="wi">
                        <div class="wm"><span>0h</span><span id="wpct">0%</span><span>20h</span></div>
                        <div class="bt">
                            <div class="bf" id="wbar" style="width:0%"></div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="ch">ACTIVITY <span class="chr" id="act-timer"></span></div>
                    <div class="fb">
                        <div id="act-idle">
                            <div style="display:flex;gap:8px;align-items:center">
                                <button class="btn act-start-btn" onclick="startActivity()">▶ start</button>
                                <input type="text" id="m-cat" placeholder="running, meal, reading…" style="flex:1">
                            </div>
                        </div>
                        <div id="act-active" style="display:none">
                            <div class="act-running"><span id="act-label-tag"></span></div>
                            <div class="brow" style="margin-top:10px">
                                <button class="btn act-end-btn" onclick="endActivity()">■ end</button>
                                <button class="btn btn-g" onclick="cancelActivity()">cancel</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="ch">TODAY BY CATEGORY <span class="chr" id="today-tot">—</span></div>
                    <div class="cb" id="cat-bars">
                        <div class="empty">no data yet</div>
                    </div>
                </div>

                <div class="card feed-card">
                    <div class="tabs">
                        <div class="tab active" onclick="switchTab('today',this)">today</div>
                        <div class="tab" onclick="switchTab('week',this)">this week</div>
                    </div>
                    <div id="feed">
                        <div class="empty">loading…</div>
                    </div>
                </div>

            </div><!-- main-col -->
        </div><!-- columns -->
    </div><!-- page -->

    <!-- Popup -->
    <div class="popup-overlay" id="popup-overlay" onclick="closePopup(event)">
        <div class="popup">
            <div class="popup-title" id="popup-title">fill in gap</div>
            <div class="popup-range" id="popup-range">—</div>
            <div class="popup-row">
                <div class="fl">CATEGORY</div><input id="p-cat" type="text" placeholder="running, sleep, meal…"
                    autocomplete="off">
            </div>
            <div class="popup-row" id="p-dur-row">
                <div class="fl">DURATION (MINUTES)</div><input type="number" id="p-dur" min="1" max="720">
            </div>
            <div class="popup-row">
                <div class="fl">NOTE (OPTIONAL)</div><input type="text" id="p-note" placeholder="optional note">
            </div>
            <div class="popup-btns">
                <button class="btn btn-g" onclick="closePopup()">cancel</button>
                <button class="btn btn-red" id="p-delete" style="display:none" onclick="deleteEntry()">delete</button>
                <button class="btn" id="p-submit" onclick="submitPopup()">+ log entry</button>
            </div>
        </div>
    </div>

    <div class="tl-tip" id="tl-tip"></div>
    <div class="toast" id="toast"></div>

    <script>
        const STYLES = {
            "Work/Study": { c: "var(--ws-c)", b: "var(--ws-b)" },
            "Reading": { c: "var(--read-c)", b: "var(--read-b)" },
            "Reddit": { c: "var(--reddit-c)", b: "var(--reddit-b)" },
            "YouTube": { c: "var(--yt-c)", b: "var(--yt-b)" },
            "Facebook": { c: "var(--fb-c)", b: "var(--fb-b)" },
            "Instagram": { c: "var(--ig-c)", b: "var(--ig-b)" },
            "Twitter": { c: "var(--tw-c)", b: "var(--tw-b)" },
            "TikTok": { c: "var(--tt-c)", b: "var(--tt-b)" },
            "Browsing": { c: "var(--browse-c)", b: "var(--browse-b)" },
            "Messaging": { c: "var(--msg-c)", b: "var(--msg-b)" },
            "Admin": { c: "var(--admin-c)", b: "var(--admin-b)" },
            "Entertainment": { c: "var(--ent-c)", b: "var(--ent-b)" },
            "News": { c: "var(--news-c)", b: "var(--news-b)" },
            "Discord": { c: "var(--disc-c)", b: "var(--disc-b)" },
            "Other": { c: "var(--oth-c)", b: "var(--oth-b)" },
            "Meal": { c: "var(--meal-c)", b: "var(--meal-b)" },
            "Sleep": { c: "var(--sleep-c)", b: "var(--sleep-b)" },
        };
        function cs(cat) { return STYLES[cat] || { c: "var(--oth-c)", b: "var(--oth-b)" }; }
        function tag(cat) { const t = cs(cat); return `<span class="tag" style="background:${t.b};color:${t.c}">${cat}</span>`; }
        function toast(m) { const e = document.getElementById('toast'); e.textContent = m; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2200); }
        function hhmm(d) { return new Date(d).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false }); }

        let currentTab = 'today', allCats = [], popupTs = null;
        async function get(url) { const r = await fetch(url); return r.json(); }

        function renderStats(st) {
            const t = st.totals;
            document.getElementById('s-today').innerHTML = `${t.today_h}<span class="su">h</span>`;
            document.getElementById('s-week').innerHTML = `${t.week_h}<span class="su">h</span>`;
            document.getElementById('s-manual').textContent = t.manual_today;
            const pct = Math.min(100, Math.round((t.week_h / t.week_goal) * 100));
            document.getElementById('wbar').style.width = pct + '%';
            document.getElementById('wpct').textContent = pct + '%';
            document.getElementById('wlabel').textContent = `${t.week_h} / ${t.week_goal}h`;
            renderBars(st.today, t.today_h);
        }

        function renderBars(cats, total) {
            document.getElementById('today-tot').textContent = `${total}h`;
            const el = document.getElementById('cat-bars');
            if (!cats || !cats.length) { el.innerHTML = '<div class="empty">no data today yet</div>'; return; }
            const max = Math.max(...cats.map(c => c.hours), 0.01);
            el.innerHTML = cats.map(c => {
                const st = cs(c.category);
                const pct = Math.round((c.hours / max) * 100);
                return `<div class="cr"><span class="cn">${c.category}</span><div class="cbt"><div class="cbf" style="width:${pct}%;background:${st.c}"></div></div><span class="ch2">${c.hours}h</span></div>`;
            }).join('');
        }

        function renderFeed(events) {
            const el = document.getElementById('feed');
            if (!events.length) { el.innerHTML = '<div class="empty">no events yet</div>'; return; }
            el.innerHTML = events.map(e => {
                const time = hhmm(e.ts);
                const dur = e.duration_s < 60 ? `${Math.round(e.duration_s)}s` : `${Math.round(e.duration_s / 60)}m`;
                const dotC = e.source === 'auto' ? cs(e.category).c : 'var(--text3)';
                const label = e.source === 'manual' ? (e.note || e.category) : (e.title || e.app || '—');
                return `<div class="fr"><span class="ft">${time}</span><span>${tag(e.category)}</span><span class="fi"><span class="dot" style="background:${dotC}"></span>${label}</span><span class="fd">${dur}</span><button class="db" onclick="del(${e.id},this)">×</button></div>`;
            }).join('');
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            get(`/api/events?days=${tab === 'today' ? 1 : 7}`).then(renderFeed);
        }

        // ── Timeline ──────────────────────────────────────────────────────────────────
        const tip = document.getElementById('tl-tip');
        function showTip(text, x, y) { tip.textContent = text; tip.style.left = (x + 12) + 'px'; tip.style.top = (y - 28) + 'px'; tip.classList.add('show'); }
        function hideTip() { tip.classList.remove('show'); }

        // Drop blocks shorter than thresholdMs (absorbing their time into the previous
        // block), then merge any adjacent same-category blocks.
        // Manual entries are never absorbed — they were explicitly placed by the user.
        function mergeSmallInterruptions(blocks, thresholdMs) {
            if (!blocks.length) return blocks;

            // Pass 1: drop tiny blocks, extending the previous block to cover their time.
            // Manual blocks are never absorbed AND never extended.
            const filtered = [];
            for (const b of blocks) {
                const dur = new Date(b.end) - new Date(b.start);
                const prev = filtered[filtered.length - 1];
                const prevIsManual = prev && prev.source === 'manual';
                if (dur < thresholdMs && filtered.length > 0 && b.source !== 'manual' && !prevIsManual) {
                    filtered[filtered.length - 1] = { ...filtered[filtered.length - 1], end: b.end };
                } else {
                    filtered.push({ ...b });
                }
            }

            // Pass 2: merge adjacent same-category blocks (only if gap < 5 minutes)
            const MERGE_GAP_MS = 5 * 60 * 1000;
            const result = [];
            for (const b of filtered) {
                const prev = result[result.length - 1];
                const gap = prev ? new Date(b.start) - new Date(prev.end) : Infinity;
                if (prev && prev.category === b.category && gap < MERGE_GAP_MS) {
                    result[result.length - 1] = { ...prev, end: b.end };
                } else {
                    result.push({ ...b });
                }
            }

            return result;
        }

        async function renderTimeline() {
            const raw = await get('/api/timeline');
            const MERGE_MS = 5 * 60 * 1000; // 5 minutes
            const blocks = mergeSmallInterruptions(raw, MERGE_MS);
            const bar = document.getElementById('tl-bar');
            const labels = document.getElementById('vtl-labels');

            const now = new Date();
            const midnight = new Date(now); midnight.setHours(0, 0, 0, 0);
            const nowMs = now - midnight;
            const DAY_MS = 86400000;

            const barH = bar.offsetHeight || window.innerHeight;

            const tickHtml = [], barHtml = [];

            for (let h = 0; h <= 23; h++) {
                const pct = (h / 24 * 100).toFixed(3) + '%';
                tickHtml.push(`<div class="vtl-tick" style="top:${pct}">${String(h).padStart(2, '0')}</div>`);
                barHtml.push(`<div class="vtl-line" style="top:${pct}"></div>`);
            }

            // Future zone
            const nowPct = (nowMs / DAY_MS * 100).toFixed(3) + '%';
            const futPct = ((DAY_MS - nowMs) / DAY_MS * 100).toFixed(3) + '%';
            barHtml.push(`<div class="vtl-future" style="top:${nowPct};height:${futPct}"></div>`);

            // Blocks and gaps
            const GAP_MIN = 2 * 60 * 1000;
            const segs = [];
            let cursor = midnight.getTime();

            for (const b of blocks) {
                const s2 = Math.max(new Date(b.start).getTime(), midnight.getTime());
                const e2 = Math.min(new Date(b.end).getTime(), now.getTime());
                if (e2 <= midnight.getTime()) continue;
                if (s2 - cursor > GAP_MIN) segs.push({ type: 'gap', start: cursor, end: s2 });
                if (e2 > s2) segs.push({ type: 'block', cat: b.category, source: b.source, id: b.id, note: b.note || '', start: s2, end: e2 });
                cursor = Math.max(cursor, e2);
            }
            if (now.getTime() - cursor > GAP_MIN) segs.push({ type: 'gap', start: cursor, end: now.getTime() });

            for (const seg of segs) {
                const startMs = seg.start - midnight.getTime();
                const durMs = seg.end - seg.start;
                const top = (startMs / DAY_MS * 100).toFixed(3) + '%';
                const ht = (durMs / DAY_MS * 100).toFixed(3) + '%';
                const si = new Date(seg.start).toISOString();
                const ei = new Date(seg.end).toISOString();
                const dm = Math.round(durMs / 60000);
                const tip = `${hhmm(si)}–${hhmm(ei)} · ${dm}m`;
                if (seg.type === 'gap') {
                    barHtml.push(`<div class="vtl-gap" style="top:${top};height:${ht}" data-start="${si}" data-end="${ei}" data-dur="${dm}" onmouseenter="showTip('${tip} gap',event.clientX,event.clientY)" onmousemove="showTip('${tip} gap',event.clientX,event.clientY)" onmouseleave="hideTip()" onclick="openGapPopup(this)"></div>`);
                } else {
                    const st = cs(seg.cat);
                    const pxH = durMs / DAY_MS * barH;
                    const lbl = pxH >= 14 ? `<div class="vtl-block-label">${seg.cat}</div>` : '';
                    if (seg.source === 'manual' && seg.id) {
                        const handles = `<div class="vtl-drag-handle vtl-drag-top" data-id="${seg.id}" data-edge="top"></div><div class="vtl-drag-handle vtl-drag-bot" data-id="${seg.id}" data-edge="bot"></div>`;
                        barHtml.push(`<div class="vtl-block vtl-manual" style="top:${top};height:${ht};background:${st.c}" data-id="${seg.id}" data-cat="${seg.cat}" data-note="${seg.note}" data-start="${si}" data-end="${ei}" data-dur="${dm}" onmouseenter="showTip('${tip} · ${seg.cat}',event.clientX,event.clientY)" onmousemove="showTip('${tip} · ${seg.cat}',event.clientX,event.clientY)" onmouseleave="hideTip()" onclick="openEditPopup(this)">${lbl}${handles}</div>`);
                    } else {
                        barHtml.push(`<div class="vtl-block" style="top:${top};height:${ht};background:${st.c}" data-start="${si}" data-end="${ei}" onmouseenter="showTip('${tip} · ${seg.cat}',event.clientX,event.clientY)" onmousemove="showTip('${tip} · ${seg.cat}',event.clientX,event.clientY)" onmouseleave="hideTip()">${lbl}</div>`);
                    }
                }
            }

            barHtml.push(`<div class="vtl-now" style="top:${nowPct}"></div>`);

            labels.innerHTML = tickHtml.join('');
            bar.innerHTML = barHtml.join('');

            const trackedMs = segs.filter(s => s.type === 'block').reduce((a, s) => a + (s.end - s.start), 0);
            return (trackedMs / 3600000).toFixed(1);
        }

        // ── Gap popup ─────────────────────────────────────────────────────────────────
        let popupEditId = null;

        function openGapPopup(el) {
            popupTs = el.dataset.start;
            popupEditId = null;
            document.getElementById('popup-title').textContent = 'fill in gap';
            document.getElementById('popup-range').textContent = `${hhmm(el.dataset.start)} – ${hhmm(el.dataset.end)}`;
            document.getElementById('p-dur-row').style.display = '';
            document.getElementById('p-dur').value = el.dataset.dur;
            document.getElementById('p-cat').value = '';
            document.getElementById('p-note').value = '';
            document.getElementById('p-delete').style.display = 'none';
            document.getElementById('p-submit').textContent = '+ log entry';
            document.getElementById('popup-overlay').classList.add('show');
        }

        function openEditPopup(el) {
            // Don't open if click came from a drag handle
            if (event.target.classList.contains('vtl-drag-handle')) return;
            popupTs = el.dataset.start;
            popupEditId = parseInt(el.dataset.id);
            document.getElementById('popup-title').textContent = 'edit entry';
            document.getElementById('popup-range').textContent = `${hhmm(el.dataset.start)} – ${hhmm(el.dataset.end)}`;
            document.getElementById('p-dur-row').style.display = 'none';
            document.getElementById('p-cat').value = el.dataset.cat;
            document.getElementById('p-note').value = el.dataset.note || '';
            document.getElementById('p-delete').style.display = '';
            document.getElementById('p-submit').textContent = 'save changes';
            document.getElementById('popup-overlay').classList.add('show');
        }

        function closePopup(e) {
            if (e && e.target !== document.getElementById('popup-overlay')) return;
            document.getElementById('popup-overlay').classList.remove('show');
            popupTs = null;
            popupEditId = null;
        }

        async function deleteEntry() {
            if (!popupEditId) return;
            await fetch(`/api/delete/${popupEditId}`, { method: 'DELETE' });
            document.getElementById('popup-overlay').classList.remove('show');
            popupTs = null; popupEditId = null;
            toast('deleted'); refresh();
        }

        async function submitPopup() {
            const cat = document.getElementById('p-cat').value.trim();
            const note = document.getElementById('p-note').value.trim();
            if (!cat) { toast('enter a category'); return; }

            if (popupEditId) {
                // Edit existing entry
                const r = await fetch(`/api/update/${popupEditId}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: cat, note })
                });
                if ((await r.json()).ok) {
                    document.getElementById('popup-overlay').classList.remove('show');
                    popupTs = null; popupEditId = null;
                    toast('saved ✓'); refresh();
                }
            } else {
                // New gap fill
                const dur = parseFloat(document.getElementById('p-dur').value);
                if (!dur || dur <= 0) { toast('enter a duration'); return; }
                const r = await fetch('/api/manual', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: cat, duration_s: dur * 60, note, ts: popupTs })
                });
                if ((await r.json()).ok) {
                    document.getElementById('popup-overlay').classList.remove('show');
                    popupTs = null; toast('logged ✓'); refresh();
                }
            }
        }

        // ── Drag to resize manual blocks ──────────────────────────────────────────────
        (function () {
            let drag = null;

            document.addEventListener('mousedown', e => {
                const handle = e.target.closest('.vtl-drag-handle');
                if (!handle) return;
                e.preventDefault();
                e.stopPropagation();
                const block = handle.closest('.vtl-manual');
                const bar = document.getElementById('tl-bar');
                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';
                bar.style.pointerEvents = 'none';
                const barRect = bar.getBoundingClientRect();
                const DAY_MS = 86400000;
                const now = new Date();
                const midnight = new Date(now); midnight.setHours(0, 0, 0, 0);

                drag = {
                    id: parseInt(block.dataset.id),
                    edge: handle.dataset.edge,
                    block,
                    bar,
                    barRect,
                    DAY_MS,
                    midnight,
                    startMs: new Date(block.dataset.start).getTime(),
                    endMs: new Date(block.dataset.end).getTime(),
                    // Find adjacent block boundaries
                    prevEnd: null,
                    nextStart: null,
                };

                // Find adjacent hard boundaries from DOM — skip gaps (free space)
                const allBlocks = [...bar.querySelectorAll('.vtl-block, .vtl-gap')];
                const idx = allBlocks.indexOf(block);
                for (let i = idx - 1; i >= 0; i--) {
                    const b = allBlocks[i];
                    if (b.classList.contains('vtl-gap')) continue;
                    if (b.dataset.end) { drag.prevEnd = new Date(b.dataset.end).getTime(); break; }
                }
                for (let i = idx + 1; i < allBlocks.length; i++) {
                    const b = allBlocks[i];
                    if (b.classList.contains('vtl-gap')) continue;
                    if (b.dataset.start) { drag.nextStart = new Date(b.dataset.start).getTime(); break; }
                }
            });

            document.addEventListener('mousemove', e => {
                if (!drag) return;
                const { barRect, DAY_MS, midnight, startMs, endMs } = drag;
                const pct = (e.clientY - barRect.top) / barRect.height;
                const snapMs = Math.round(pct * DAY_MS / 60000) * 60000; // snap to minute
                const tsMs = midnight.getTime() + snapMs;

                const MIN_DUR = 60000; // 1 minute minimum
                if (drag.edge === 'top') {
                    const lo = drag.prevEnd !== null ? drag.prevEnd : midnight.getTime();
                    const hi = endMs - MIN_DUR;
                    const newStart = Math.max(lo, Math.min(hi, tsMs));
                    const newDurMs = endMs - newStart;
                    const newTop = ((newStart - midnight.getTime()) / DAY_MS * 100).toFixed(3) + '%';
                    const newHt = (newDurMs / DAY_MS * 100).toFixed(3) + '%';
                    drag.block.style.top = newTop;
                    drag.block.style.height = newHt;
                    drag.pendingStart = new Date(newStart).toISOString();
                    drag.pendingDur = newDurMs / 1000;
                } else {
                    const lo = startMs + MIN_DUR;
                    const hi = drag.nextStart !== null ? drag.nextStart : new Date().getTime();
                    const newEnd = Math.max(lo, Math.min(hi, tsMs));
                    const newDurMs = newEnd - startMs;
                    const newHt = (newDurMs / DAY_MS * 100).toFixed(3) + '%';
                    drag.block.style.height = newHt;
                    drag.pendingDur = newDurMs / 1000;
                }
            });

            document.addEventListener('mouseup', async e => {
                if (!drag) return;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                drag.bar.style.pointerEvents = '';
                const { id, pendingStart, pendingDur } = drag;
                drag = null;
                if (!pendingDur) return;
                const body = { duration_s: pendingDur };
                if (pendingStart) body.ts = pendingStart;
                await fetch(`/api/update/${id}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                toast('updated ✓'); refresh();
            });
        })();

        // ── Activity timer ────────────────────────────────────────────────────────────
        let actStartTs = null, actTimerInt = null;
        function startTimerTick() {
            if (actTimerInt) clearInterval(actTimerInt);
            actTimerInt = setInterval(() => {
                if (!actStartTs) return;
                const e = Math.floor((Date.now() - new Date(actStartTs)) / 1000);
                document.getElementById('act-timer').textContent = `${String(Math.floor(e / 60)).padStart(2, '0')}:${String(e % 60).padStart(2, '0')}`;
            }, 1000);
        }
        async function startActivity() {
            const raw = document.getElementById('m-cat').value.trim();
            if (!raw) { toast('enter an activity first'); return; }
            const cat = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
            const ts = new Date().toISOString();
            const r = await fetch('/api/activity/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: cat, ts }) });
            if (!(await r.json()).ok) return;
            actStartTs = ts;
            document.getElementById('act-idle').style.display = 'none';
            document.getElementById('act-active').style.display = 'block';
            const st = cs(cat);
            document.getElementById('act-label-tag').innerHTML = `<span class="tag" style="background:${st.b};color:${st.c}">${cat}</span>`;
            startTimerTick();
        }
        async function endActivity() {
            const r = await fetch('/api/activity/end', { method: 'POST' });
            const data = await r.json();
            if (data.ok) { toast(`logged ${Math.round(data.duration_s / 60)}m of ${data.category} ✓`); resetActivity(); refresh(); }
        }
        async function cancelActivity() {
            await fetch('/api/activity/cancel', { method: 'POST' });
            resetActivity(); toast('cancelled');
        }
        function resetActivity() {
            actStartTs = null; clearInterval(actTimerInt); actTimerInt = null;
            document.getElementById('act-idle').style.display = 'block';
            document.getElementById('act-active').style.display = 'none';
            document.getElementById('act-timer').textContent = '';
            document.getElementById('m-cat').value = '';
        }
        async function checkActivityStatus() {
            try {
                const s = await fetch('/api/activity/status').then(r => r.json());
                if (s.running && !actStartTs) {
                    actStartTs = s.ts;
                    document.getElementById('act-idle').style.display = 'none';
                    document.getElementById('act-active').style.display = 'block';
                    const st = cs(s.category);
                    document.getElementById('act-label-tag').innerHTML = `<span class="tag" style="background:${st.b};color:${st.c}">${s.category}</span>`;
                    startTimerTick();
                } else if (!s.running && actStartTs) {
                    if (s.stopped_by === 'auto') toast('activity auto-stopped — window switch detected');
                    resetActivity();
                }
            } catch (e) { }
        }

        async function del(id, btn) {
            btn.closest('.fr').style.opacity = '0.3';
            await fetch(`/api/delete/${id}`, { method: 'DELETE' });
            toast('deleted'); refresh();
        }
        function exportCSV(days) { window.location.href = `/api/export?days=${days}`; }

        async function refresh() {
            try {
                const [stats, events] = await Promise.all([get('/api/stats'), get(`/api/events?days=${currentTab === 'today' ? 1 : 7}`)]);
                renderStats(stats);
                renderFeed(events);
                await renderTimeline();
                await checkActivityStatus();
                const now = new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false });
                const trackedH = stats.totals.today_h;
                document.getElementById('last-up').textContent = `updated ${now} · ${trackedH}h tracked today`;
            } catch (e) {
                document.getElementById('last-up').textContent = 'server unavailable';
            }
        }

        async function init() {
            const cats = await get('/api/categories').catch(() => ({
                auto: ["Work/Study", "Reading", "Reddit", "YouTube", "Facebook", "Instagram", "Twitter", "TikTok", "Browsing", "Messaging", "Admin", "Entertainment", "News", "Discord", "Other"],
                manual: ["Messaging", "Reading", "Sleep", "Meal", "Admin", "Other"]
            }));
            allCats = [...new Set([...cats.auto, ...cats.manual])];
            document.getElementById('m-cat').addEventListener('keydown', e => { if (e.key === 'Enter') startActivity(); });
            refresh();
            setInterval(refresh, 30000);
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('popup-overlay').classList.remove('show'); });
        init();
    </script>
</body>
